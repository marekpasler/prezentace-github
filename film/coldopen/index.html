<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Plex Mono"; font-weight: 400; src: url("assets/fonts/plex-mono-400-latin.woff2") format("woff2"); }
      @font-face { font-family: "Plex Mono"; font-weight: 600; src: url("assets/fonts/plex-mono-600-latin.woff2") format("woff2"); }
      :root {
        --ground: #0d1117;
        --ink: #f0f6fc;
        --mint: #5effc4;
        --bg: #0d1117;
        --surface: #161b22;
        --border: #3d444d;
        --muted: #b7c0ca;
        --brand: #5effc4;
        --accent-2: #ffb86b;
        --font-mono: "Plex Mono", ui-monospace, monospace;
        --ctr-font-size: 48px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: var(--font-mono); }
      #term { --ctr-font-size: 54px; }
      #rain-clip, #url-clip { position: absolute; inset: 0; }
      #rain { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #url-clip { display: grid; place-items: center; }
      .url { position: relative; font: 600 150px/1 var(--font-mono); letter-spacing: -0.02em; color: var(--mint); }
      .url .ghost { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; }
      .url .r { color: #ff4d6d; }
      .url .c { color: #3ad7ff; }
      #tagline { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font: 400 44px var(--font-mono); color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.5" data-width="1920" data-height="1080">
      <!-- 1: the real push of the ball website, typed by the registry terminal -->
      <div
        id="term"
        data-composition-id="term"
        data-composition-src="compositions/components/code-terminal-run.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-variable-values='{"prompt_glyph":"~/plesoktava $","cadence":"human","cues":"1.75,2.15","accent":"green","exit":"fade"}'
      ></div>

      <!-- 2: digital rain that lands on the URL's glyphs -->
      <div id="rain-clip" class="clip" data-start="2.9" data-duration="5.6" data-track-index="1">
        <canvas id="rain" width="1920" height="1080"></canvas>
      </div>

      <!-- 3: the URL, with a short RGB tear as it locks in -->
      <div id="url-clip" class="clip" data-start="5.9" data-duration="2.6" data-track-index="2">
        <h1 class="url" id="url"><span class="ghost r">8a8.gkolin.cz</span><span class="ghost c">8a8.gkolin.cz</span><span class="solid">8a8.gkolin.cz</span></h1>
        <p id="tagline">nula korun, běží nonstop, jeden příkaz</p>
      </div>
    </div>

    <script>
      (function () {
        const cv = document.getElementById("rain");
        const ctx = cv.getContext("2d");
        const GLY = "01アイウエオカキクケコサシスセソ<>/{}=+*#$gitpush";
        const COLS = 69, CW = 28, ROWS = 39, T0 = 2.9;
        // seeded LCG: same frame every render
        let seed = 7;
        const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
        const cols = Array.from({ length: COLS }, () => ({ s: 14 + rnd() * 14, o: rnd() * 40, L: 8 + rnd() * 16, d: rnd() * 0.7 }));
        const hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) >>> 0; h = ((h ^ (h >>> 13)) * 1274126177) >>> 0; return (h ^ (h >>> 16)) >>> 0; };
        const clamp = (x) => Math.max(0, Math.min(1, x));
        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

        let P = null; // particles sampled from the real glyphs (lazily, once the font is in)
        function sample() {
          const o = document.createElement("canvas"); o.width = 1920; o.height = 1080;
          const c = o.getContext("2d");
          c.font = '600 150px "Plex Mono"'; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = "#fff";
          c.fillText("8a8.gkolin.cz", 960, 540);
          const px = c.getImageData(0, 0, 1920, 1080).data, out = [];
          let s2 = 99; const r2 = () => ((s2 = (s2 * 1664525 + 1013904223) >>> 0) / 4294967296);
          for (let y = 0; y < 1080; y += 9) for (let x = 0; x < 1920; x += 9)
            if (px[(y * 1920 + x) * 4 + 3] > 140) out.push({ tx: x, ty: y, sx: Math.floor(r2() * COLS) * CW + 8, sy: r2() * 1080, d: r2() * 0.45, g: Math.floor(r2() * 1e6) });
          return out;
        }

        function renderAt(t) {
          ctx.clearRect(0, 0, 1920, 1080);
          if (t < T0) return;
          const conv = ease(clamp((t - 4.5) / 1.9));
          const fade = 1 - clamp((t - 6.2) / 0.7);
          const live = clamp((t - T0) / 0.5) * (1 - conv);
          ctx.globalAlpha = fade;
          ctx.font = '24px "Plex Mono"';
          const tick = Math.floor(t * 12);
          for (let i = 0; i < COLS; i++) {
            const k = cols[i];
            if (t < T0 + k.d || live <= 0) continue;
            const head = ((t - T0 - k.d) * k.s + k.o) % (ROWS + k.L + 6);
            for (let j = 0; j < k.L; j++) {
              const r = Math.floor(head) - j;
              if (r < 0 || r > ROWS) continue;
              const a = (1 - j / k.L) * live;
              ctx.fillStyle = j === 0 ? `rgba(215,255,240,${a})` : `rgba(94,255,196,${a * 0.85})`;
              ctx.fillText(GLY[hash(i, r, tick) % GLY.length], i * CW + 8, r * CW);
            }
          }
          if (conv > 0) {
            if (!P) P = sample();
            ctx.font = '600 13px "Plex Mono"';
            ctx.fillStyle = "#5effc4";
            for (const p of P) {
              const q = ease(clamp((conv - p.d) / 0.55));
              const g = q < 1 ? hash(p.g, tick, 3) : p.g;
              ctx.fillText(GLY[g % GLY.length], p.sx + (p.tx - p.sx) * q, p.sy + (p.ty - p.sy) * q);
            }
          }
          ctx.globalAlpha = 1;
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);

        const tl = gsap.timeline({ paused: true });
        // URL locks in: solid fades up, red/cyan copies tear and settle
        tl.fromTo("#url .solid", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.0);
        tl.fromTo("#url .r", { opacity: 0.9, x: -14 }, { opacity: 0, x: 0, duration: 0.45, ease: "steps(6)" }, 6.05);
        tl.fromTo("#url .c", { opacity: 0.9, x: 14 }, { opacity: 0, x: 0, duration: 0.45, ease: "steps(6)" }, 6.05);
        tl.fromTo("#tagline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 6.9);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
