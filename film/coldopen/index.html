<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      Cold open, storyline A "Jeden řádek" (10 s):
      a single `git push` collapses into its commit, the commit travels
      computer → GitHub → web, and the web node opens into the real live site.
      Motion: power3 family only, durations 0.6 / 1.2 / 2.4 s, no overshoot,
      no glitch / rain / scramble / typewriter. One motif: the mint dot.
    -->
    <style>
      @font-face { font-family: "Plex Mono"; font-weight: 400; src: url("assets/fonts/plex-mono-400-latin.woff2") format("woff2"); }
      @font-face { font-family: "Plex Mono"; font-weight: 600; src: url("assets/fonts/plex-mono-600-latin.woff2") format("woff2"); }
      @font-face { font-family: "Plex Sans"; font-weight: 700; src: url("assets/fonts/plex-sans-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Plex Sans"; font-weight: 700; src: url("assets/fonts/plex-sans-700.woff2") format("woff2"); unicode-range: U+0100-024F; }
      @font-face { font-family: "Plex Sans"; font-weight: 400; src: url("assets/fonts/plex-sans-400-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Plex Sans"; font-weight: 400; src: url("assets/fonts/plex-sans-400.woff2") format("woff2"); unicode-range: U+0100-024F; }
      :root { --bg: #0d1117; --surface: #161b22; --line: #3d444d; --ink: #f0f6fc; --muted: #b7c0ca; --mint: #5effc4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: "Plex Sans", sans-serif; }
      .scene { position: absolute; inset: 0; }

      /* 1 — the command */
      #cmd { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font: 600 180px/1.1 "Plex Mono", monospace; white-space: nowrap; }
      #cmd .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em; }
      #cmd .w { display: inline-block; }
      #cmd .p { color: var(--mint); }
      #caret { display: inline-block; width: .55em; height: .9em; background: var(--mint); vertical-align: -.08em; margin-left: .08em; }

      /* 2 — the path */
      #path svg { position: absolute; inset: 0; }
      .node { position: absolute; top: 470px; width: 480px; margin-left: -240px; white-space: nowrap; text-align: center; }
      .node .d { width: 44px; height: 44px; border-radius: 50%; border: 6px solid var(--line); background: var(--bg); margin: 0 auto 30px; }
      .node b { display: block; font: 700 64px/1.1 "Plex Sans"; }
      .node span { display: block; margin-top: 10px; font: 400 48px "Plex Mono"; color: var(--muted); }
      #dot { position: absolute; left: 344px; top: 476px; width: 32px; height: 32px; border-radius: 50%; background: var(--mint); }

      /* 3 — the live site */
      #win { position: absolute; left: 200px; top: 110px; width: 1520px; height: 870px; border: 3px solid var(--line); border-radius: 22px; overflow: hidden; background: var(--surface); }
      #bar { height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 3px solid var(--line); font: 400 48px "Plex Mono"; color: var(--ink); }
      #bar i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
      #url { margin-left: 18px; }
      #site { display: block; width: 100%; height: 783px; object-fit: contain; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="s-cmd" class="scene clip" data-start="0" data-duration="3.2" data-track-index="0">
        <div id="cmd"><span class="m"><span class="w p">$</span></span> <span class="m"><span class="w">git</span></span> <span class="m"><span class="w">push</span></span><span id="caret"></span></div>
      </div>

      <div id="s-path" class="scene clip" data-start="2.6" data-duration="6.4" data-track-index="1">
        <div id="path">
          <svg viewBox="0 0 1920 1080">
            <path id="base" d="M360 492 H1560" stroke="#3d444d" stroke-width="6" fill="none" />
            <path id="lit1" d="M360 492 H960" stroke="#5effc4" stroke-width="6" fill="none" />
            <path id="lit2" d="M960 492 H1560" stroke="#5effc4" stroke-width="6" fill="none" />
          </svg>
          <div class="node" id="n1" style="left:360px"><div class="d"></div><b>můj počítač</b><span>git push</span></div>
          <div class="node" id="n2" style="left:960px"><div class="d"></div><b>GitHub</b><span>main → 4060246</span></div>
          <div class="node" id="n3" style="left:1560px"><div class="d"></div><b>web</b><span>8a8.gkolin.cz</span></div>
          <div id="dot"></div>
        </div>
      </div>

      <div id="s-site" class="scene clip" data-start="6.6" data-duration="3.4" data-track-index="2">
        <div id="win">
          <div id="bar"><i></i><i></i><i></i><span id="url">https://8a8.gkolin.cz</span></div>
          <img id="site" src="assets/site.jpg" alt="" />
        </div>
      </div>
    </div>

    <script>
      (function () {
        const IN = "power3.out", OUT = "power3.in", MOVE = "power3.inOut";
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        const L1 = 600, L2 = 600; // px lengths of the two lit segments

        // 1 — command rises out of its mask, holds, then collapses into the commit
        tl.fromTo("#cmd .w", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: IN, stagger: 0.08 }, 0.3);
        tl.set("#caret", { opacity: 0 }, 0);
        tl.set("#caret", { opacity: 1 }, 0.9);
        tl.set("#caret", { opacity: 0 }, 2.4);
        tl.to("#cmd", { scale: 0.05, x: 360 - 960, y: 492 - 530, opacity: 0, duration: 0.6, ease: OUT, transformOrigin: "50% 50%" }, 2.4);

        // 2 — the path appears; the commit dot travels node to node and lights each one
        tl.fromTo("#base", { attr: { "stroke-dasharray": 1200, "stroke-dashoffset": 1200 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: MOVE }, 2.8);
        tl.set(["#lit1", "#lit2"], { attr: { "stroke-dasharray": 600, "stroke-dashoffset": 600 } }, 2.6);
        tl.fromTo(".node", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: IN, stagger: 0.08 }, 2.9);
        tl.fromTo("#dot", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: IN }, 2.9);
        tl.to("#n1 .d", { backgroundColor: "#5effc4", borderColor: "#5effc4", duration: 0.6 }, 3.0);
        tl.to("#dot", { x: L1, duration: 1.2, ease: MOVE }, 3.6);
        tl.to("#lit1", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: MOVE }, 3.6);
        tl.to("#n2 .d", { backgroundColor: "#5effc4", borderColor: "#5effc4", duration: 0.6 }, 4.6);
        tl.to("#dot", { x: L1 + L2, duration: 1.2, ease: MOVE }, 4.8);
        tl.to("#lit2", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: MOVE }, 4.8);
        tl.to("#n3 .d", { backgroundColor: "#5effc4", borderColor: "#5effc4", duration: 0.6 }, 5.8);

        // 3 — the web node opens into the live site (the dot is the window's seed)
        tl.to(["#path svg", ".node", "#dot"], { opacity: 0, duration: 0.6, ease: OUT }, 6.3);
        tl.fromTo("#win", { x: 1560 - 960, y: 492 - 545, scale: 0.03 }, { x: 0, y: 0, scale: 1, duration: 1.2, ease: MOVE }, 6.6);
        tl.fromTo("#site", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: IN }, 6.9);
        tl.fromTo("#url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 7.5);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
